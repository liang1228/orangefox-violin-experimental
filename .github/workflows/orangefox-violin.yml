name: Experimental OrangeFox violin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout experimental device tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Free disk space on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache clang curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf lib32ncurses-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5 libssl-dev libxml2-utils lzop \
            openjdk-11-jdk patch perl python3 python-is-python3 rsync \
            unzip wget xsltproc zip zlib1g-dev
          sudo curl -fsSL --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod 0755 /usr/local/bin/repo
          git config --global user.name 'violin-build'
          git config --global user.email 'violin-build@users.noreply.github.com'
          df -h "$GITHUB_WORKSPACE"

      - name: Sync OrangeFox sources
        shell: bash
        run: |
          set -euo pipefail
          git clone https://gitlab.com/OrangeFox/sync.git "$RUNNER_TEMP/fox-sync"
          git -C "$RUNNER_TEMP/fox-sync" checkout 03434a833701f73430cd085738ae0bf54f2231f1
          cd "$RUNNER_TEMP/fox-sync"
          ./orangefox_sync.sh --branch 12.1 --path "$RUNNER_TEMP/fox_12.1"
          test -d "$RUNNER_TEMP/fox_12.1/vendor/twrp"

      - name: Install device tree and build recovery
        shell: bash
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/fox_12.1"
          mkdir -p device/xiaomi
          cp -a "$GITHUB_WORKSPACE/device/xiaomi/violin" device/xiaomi/violin
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_violin-eng
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          mka recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/build-output/build.log"
          test -f out/target/product/violin/recovery.img
          cp out/target/product/violin/recovery.img "$GITHUB_WORKSPACE/build-output/EXPERIMENTAL-NOT-FOR-FLASH-recovery.img"
          sha256sum "$GITHUB_WORKSPACE/build-output/EXPERIMENTAL-NOT-FOR-FLASH-recovery.img" > "$GITHUB_WORKSPACE/build-output/SHA256SUMS"

      - name: Upload experimental artifact and build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orangefox-violin-experimental-${{ github.run_id }}
          path: build-output/
          if-no-files-found: warn
          retention-days: 7
